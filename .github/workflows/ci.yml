name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    name: Lint, PHPStan and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # vendor-prefixed is committed: the Strauss scripts are not needed here.
      - run: composer install --no-interaction --no-progress --no-scripts

      - run: composer validate --strict
      - run: composer lint
      - run: composer analyse
      - run: composer test

  wordpress:
    name: WordPress, Http and Cli tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer install --no-interaction --no-progress --no-scripts

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm env:start < /dev/null
      - run: pnpm test:wordpress
